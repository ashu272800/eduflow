# Server
server.port=8080

# Database (PostgreSQL)
# Ye teen lines replace karo
spring.datasource.url=jdbc:mysql://localhost:3306/eduflow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=user@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialect bhi change karo
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:eduflow_super_secret_key_change_in_production_2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Async Thread Pool
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=EduFlow-Async-

# Mail (configure for production)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.eduflow=INFO
logging.level.org.springframework.security=WARN
